<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>マロンのお部屋パートナー</title>
  <style>
    :root {
      --panel: rgba(18, 22, 32, 0.68);
      --border: rgba(255, 255, 255, 0.18);
      --text: #f6f8fc;
      --accent: #f6b963;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #0d1017;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    /* 横画面推奨案内（縦画面時に表示） */
    .portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 16, 23, 0.96);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }

    @media (orientation: portrait) {
      .portrait-warning {
        display: flex;
      }
    }

    /* パスコードロック画面 */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1e2433 0%, #0d1017 100%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      transition: opacity 0.4s ease;
    }

    .lock-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lock-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .lock-dots {
      display: flex;
      gap: 12px;
      margin: 4px 0;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      transition: background 0.15s ease;
    }

    .dot.filled {
      background: var(--accent);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      gap: 10px;
    }

    .key-btn {
      height: 50px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text);
      cursor: pointer;
    }

    .key-btn:active {
      background: rgba(246, 185, 99, 0.35);
      transform: scale(0.95);
    }

    .lock-msg {
      height: 18px;
      font-size: 12.5px;
      color: #ff9c9c;
    }

    /* メインステージ（横画面16:9前提） */
    .full-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .room-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    /* ラグの上にちょうど座るサイズと位置（16:9背景用） */
    .marron-canvas {
      position: absolute;
      left: 55%;
      bottom: calc(15% + env(safe-area-inset-bottom));
      width: min(21vw, 29vh, 210px);
      height: auto;
      transform: translateX(-50%);
      transform-origin: center bottom;
      pointer-events: none;
      z-index: 3;
    }

    .top-bar {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clock-pill {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .time-select {
      background: var(--panel);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .reaction-bubble {
      position: absolute;
      top: calc(56px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 10;
      pointer-events: none;
    }

    .reaction-bubble.show {
      opacity: 1;
    }

    .bottom-controls {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    button.ctrl-btn {
      background: var(--panel);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button.ctrl-btn:active {
      transform: scale(0.95);
    }

    button.ctrl-btn.primary {
      background: rgba(246, 185, 99, 0.32);
      border-color: rgba(246, 185, 99, 0.72);
      color: #ffe5b8;
    }

    video#sourceVideo {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 縦画面時の案内 -->
  <div class="portrait-warning">
    <div style="font-size: 36px;">📱🔄</div>
    <div style="font-size: 17px; font-weight: 700;">iPadを横向きにしてね</div>
    <div style="font-size: 13px; color: #aab3c5;">マロンのお部屋パートナーは横画面専用です</div>
  </div>

  <!-- パスコードロック画面 (9648) -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-title">🐾 マロンのお部屋パスコード</div>
    <div class="lock-dots" id="lockDots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="keypad" id="keypad">
      <button class="key-btn" data-key="1">1</button>
      <button class="key-btn" data-key="2">2</button>
      <button class="key-btn" data-key="3">3</button>
      <button class="key-btn" data-key="4">4</button>
      <button class="key-btn" data-key="5">5</button>
      <button class="key-btn" data-key="6">6</button>
      <button class="key-btn" data-key="7">7</button>
      <button class="key-btn" data-key="8">8</button>
      <button class="key-btn" data-key="9">9</button>
      <button class="key-btn" data-key="C" style="font-size:14px;">クリア</button>
      <button class="key-btn" data-key="0">0</button>
      <button class="key-btn" data-key="BS" style="font-size:14px;">⌫</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div class="full-stage" id="stage">
    <img id="roomImg" class="room-layer" src="assets/room_day.jpg" alt="マロンのお部屋" />
    <canvas id="marronCanvas" class="marron-canvas"></canvas>

    <div class="top-bar">
      <div class="clock-pill" id="clockText">--:--</div>
      <div class="top-right">
        <button class="ctrl-btn" id="bgmToggleBtn">🎵 BGM: ON</button>
        <select class="time-select" id="timeMode" aria-label="時間帯モード">
          <option value="auto">時間帯: 自動</option>
          <option value="morning">朝 (morning)</option>
          <option value="day">昼 (day)</option>
          <option value="sunset">夕方 (sunset)</option>
          <option value="night">夜 (night)</option>
          <option value="midnight">深夜 (midnight)</option>
        </select>
      </div>
    </div>

    <div class="reaction-bubble" id="bubble">ワンワン！</div>

    <div class="bottom-controls">
      <button class="ctrl-btn primary" id="petBtn">🐾 なでる</button>
      <button class="ctrl-btn primary" id="treatBtn">🦴 おやつ</button>
      <button class="ctrl-btn primary" id="barkBtn">🐶 呼ぶ</button>
      <button class="ctrl-btn" id="sleepBtn">💤 おやすみ</button>
      <button class="ctrl-btn" id="wakeBtn">☀️ 画面常時ON</button>
    </div>
  </div>

  <video id="sourceVideo" src="assets/marron_sit.mp4" autoplay loop muted playsinline></video>
  <audio id="bgmPlayer" loop preload="auto"></audio>

  <script>
    const PASSCODE = "9648";

    const ASSETS = {
      slots: {
        morning:  { room: "assets/room_morning.jpg",  bgm: "assets/bgm_morning.mp3" },
        day:      { room: "assets/room_day.jpg",      bgm: "assets/bgm_day.mp3" },
        sunset:   { room: "assets/room_sunset.jpg",   bgm: "assets/bgm_sunset.mp3" },
        night:    { room: "assets/room_night.jpg",    bgm: "assets/bgm_night.mp3" },
        midnight: { room: "assets/room_midnight.jpg", bgm: "assets/bgm_midnight.mp3" }
      },
      motions: {
        sit:   "assets/marron_sit.mp4",
        down:  "assets/marron_down.mp4",
        sleep: "assets/marron_sleep.mp4",
        pet:   "assets/marron_pet.mp4",
        sweet: "assets/marron_sweet.mp4",
        bark:  "assets/marron_bark.mp4"
      }
    };

    // ロック画面処理
    let inputCode = "";
    let isUnlocked = false;
    const lockScreen = document.getElementById("lockScreen");
    const lockDots = document.querySelectorAll("#lockDots .dot");
    const lockMsg = document.getElementById("lockMsg");

    function updateDots() {
      lockDots.forEach((dot, idx) => {
        dot.classList.toggle("filled", idx < inputCode.length);
      });
    }

    document.getElementById("keypad").addEventListener("click", (e) => {
      const btn = e.target.closest(".key-btn");
      if (!btn || isUnlocked) return;
      const key = btn.dataset.key;

      if (key === "C") {
        inputCode = "";
        lockMsg.textContent = "";
      } else if (key === "BS") {
        inputCode = inputCode.slice(0, -1);
        lockMsg.textContent = "";
      } else if (inputCode.length < 4) {
        inputCode += key;
      }
      updateDots();

      if (inputCode.length === 4) {
        if (inputCode === PASSCODE) {
          isUnlocked = true;
          lockScreen.classList.add("hidden");
          startAppAfterUnlock();
        } else {
          lockMsg.textContent = "パスコードが違うみたい…";
          setTimeout(() => {
            inputCode = "";
            updateDots();
          }, 450);
        }
      }
    });

    // メインアプリ要素
    const roomImg = document.getElementById("roomImg");
    const clockText = document.getElementById("clockText");
    const timeMode = document.getElementById("timeMode");
    const bubble = document.getElementById("bubble");
    const bgmPlayer = document.getElementById("bgmPlayer");
    const bgmToggleBtn = document.getElementById("bgmToggleBtn");
    const wakeBtn = document.getElementById("wakeBtn");

    const video = document.getElementById("sourceVideo");
    const canvas = document.getElementById("marronCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let currentSlot = "";
    let currentMotion = "sit";
    let bgmEnabled = true;
    let wakeLock = null;
    let bubbleTimer = null;

    function showBubble(text, duration = 2600) {
      bubble.textContent = text;
      bubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), duration);
    }

    function getAutoSlot(hour) {
      if (hour >= 5 && hour < 10) return "morning";
      if (hour >= 10 && hour < 16) return "day";
      if (hour >= 16 && hour < 19) return "sunset";
      if (hour >= 19 && hour < 23) return "night";
      return "midnight";
    }

    function syncRoomAndBgm() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      clockText.textContent = `${hh}:${mm}`;

      const slot = timeMode.value === "auto" ? getAutoSlot(now.getHours()) : timeMode.value;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;

      if (roomImg.getAttribute("src") !== asset.room) {
        roomImg.src = asset.room;
      }

      if (currentSlot !== slot) {
        currentSlot = slot;
        bgmPlayer.src = asset.bgm;
        bgmPlayer.volume = 0.55;
        if (isUnlocked && bgmEnabled) {
          bgmPlayer.play().catch(() => {});
        }
      }
    }

    // モーション切り替え（loop=true は待機系、false は1回再生後にお座りへ戻る）
    function playMotion(motionKey, { loop = false, text = "" } = {}) {
      const src = ASSETS.motions[motionKey];
      if (!src) return;

      currentMotion = motionKey;
      video.loop = loop;
      video.src = src;
      video.load();
      video.play().catch(() => {});

      if (text) showBubble(text);
    }

    video.addEventListener("ended", () => {
      if (!video.loop) {
        playMotion("sit", { loop: true });
      }
    });

    // ブルーバック透過処理
    function renderChromaKey() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          if (b > 95 && b - Math.max(r, g) > 35) {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(renderChromaKey);
    }

    function startAppAfterUnlock() {
      syncRoomAndBgm();
      playMotion("bark", { loop: false, text: "ワンワン！（おかえり〜！）" });
      if (bgmEnabled) {
        bgmPlayer.play().catch(() => {});
      }
    }

    // アクションボタン
    document.getElementById("petBtn").addEventListener("click", () => {
      playMotion("pet", { loop: false, text: "なでなで気持ちいいな〜♪" });
    });

    document.getElementById("treatBtn").addEventListener("click", () => {
      playMotion("sweet", { loop: false, text: "おやつだ！モグモグ…おいしいワン！" });
    });

    document.getElementById("barkBtn").addEventListener("click", () => {
      playMotion("bark", { loop: false, text: "ワン！（呼んだ？）" });
    });

    document.getElementById("sleepBtn").addEventListener("click", () => {
      if (currentMotion === "sleep") {
        playMotion("sit", { loop: true, text: "ふわぁ…起きたよ！" });
      } else {
        playMotion("sleep", { loop: true, text: "すやすや…おやすみ〜…" });
      }
    });

    bgmToggleBtn.addEventListener("click", () => {
      bgmEnabled = !bgmEnabled;
      if (bgmEnabled) {
        bgmToggleBtn.textContent = "🎵 BGM: ON";
        bgmPlayer.play().catch(() => {});
      } else {
        bgmToggleBtn.textContent = "🔇 BGM: OFF";
        bgmPlayer.pause();
      }
    });

    wakeBtn.addEventListener("click", async () => {
      try {
        if (!("wakeLock" in navigator)) {
          showBubble("このブラウザはスリープ防止に非対応だよ");
          return;
        }
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeBtn.textContent = "☀️ 常時ON中";
          showBubble("画面を起こしたまま一緒にいるね");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            wakeBtn.textContent = "☀️ 画面常時ON";
          });
        } else {
          await wakeLock.release();
        }
      } catch (err) {
        showBubble("スリープ防止をONにできなかったよ");
      }
    });

    // 気まぐれ自律行動（待機中にお座り・伏せ・居眠りをランダム切り替え）
    setInterval(() => {
      if (!isUnlocked) return;
      if (currentMotion === "sit" && Math.random() < 0.35) {
        if (currentSlot === "midnight" || currentSlot === "night") {
          playMotion("sleep", { loop: true, text: "うとうと…眠くなってきたワン…" });
        } else {
          playMotion("down", { loop: true, text: "ちょっと伏せてまったりしようっと" });
        }
      } else if ((currentMotion === "down" || currentMotion === "sleep") && Math.random() < 0.4) {
        playMotion("sit", { loop: true, text: "むくり！お座りしたよ" });
      }
    }, 35000);

    timeMode.addEventListener("change", syncRoomAndBgm);

    syncRoomAndBgm();
    setInterval(syncRoomAndBgm, 15000);
    video.play().catch(() => {});
    renderChromaKey();
  </script>
</body>
</html>
