<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>マロンのお部屋パートナー</title>
  <style>
    :root {
      --panel: rgba(18, 22, 32, 0.62);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f6f8fc;
      --accent: #f6b963;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d1017;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    .full-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .room-layer {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      object-fit: cover;
      pointer-events: none;
      will-change: transform;
    }

    .marron-canvas {
      position: absolute;
      left: 50%;
      bottom: 7%;
      width: min(70vw, 420px);
      max-width: 78%;
      height: auto;
      transform: translate3d(-50%, 0px, 0px);
      transform-origin: center bottom;
      pointer-events: none;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.35));
      will-change: transform;
    }

    @media (orientation: landscape) {
      .marron-canvas {
        width: min(36vh, 360px);
        bottom: 6%;
      }
    }

    .marron-canvas.bounce {
      animation: marronBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes marronBounce {
      0%   { transform: translate3d(calc(-50% + var(--mx, 0px)), 0px, 0px) scale(1, 1); }
      35%  { transform: translate3d(calc(-50% + var(--mx, 0px)), -18px, 0px) scale(1.06, 0.94); }
      70%  { transform: translate3d(calc(-50% + var(--mx, 0px)), 4px, 0px) scale(0.97, 1.03); }
      100% { transform: translate3d(calc(-50% + var(--mx, 0px)), 0px, 0px) scale(1, 1); }
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .clock-pill {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .time-select {
      background: var(--panel);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .reaction-bubble {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 10;
      pointer-events: none;
    }

    .reaction-bubble.show {
      opacity: 1;
    }

    .bottom-controls {
      position: absolute;
      bottom: 14px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }

    button {
      background: var(--panel);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    button.primary {
      background: rgba(246, 185, 99, 0.28);
      border-color: rgba(246, 185, 99, 0.65);
      color: #ffe5b8;
    }

    video#sourceVideo {
      display: none;
    }
  </style>
</head>
<body>
  <div class="full-stage" id="stage">
    <img id="roomImg" class="room-layer" src="assets/room_day.png" alt="マロンのお部屋" />
    <canvas id="marronCanvas" class="marron-canvas"></canvas>

    <div class="top-bar">
      <div class="clock-pill" id="clockText">--:--</div>
      <select class="time-select" id="timeMode" aria-label="時間帯モード">
        <option value="auto">時間帯: 自動</option>
        <option value="morning">朝 (morning)</option>
        <option value="day">昼 (day)</option>
        <option value="sunset">夕方 (sunset)</option>
        <option value="night">夜 (night)</option>
        <option value="midnight">深夜 (midnight)</option>
      </select>
    </div>

    <div class="reaction-bubble" id="bubble">ワン！</div>

    <div class="bottom-controls">
      <button class="primary" id="petBtn">🐾 なでる</button>
      <button class="primary" id="treatBtn">🦴 おやつ</button>
      <button id="parallaxBtn">👁️ 視差: 弱</button>
      <button id="wakeBtn">☀️ 画面常時ON</button>
    </div>
  </div>

  <video id="sourceVideo" src="assets/marron_sit.mp4" autoplay loop muted playsinline></video>

  <script>
    const ASSETS = {
      rooms: {
        morning:  "assets/room_morning.png",
        day:      "assets/room_day.png",
        sunset:   "assets/room_sunset.png",
        night:    "assets/room_night.png",
        midnight: "assets/room_midnight.png"
      },
      sitVideo: "assets/marron_sit.mp4"
    };

    const roomImg = document.getElementById("roomImg");
    const clockText = document.getElementById("clockText");
    const timeMode = document.getElementById("timeMode");
    const bubble = document.getElementById("bubble");
    const petBtn = document.getElementById("petBtn");
    const treatBtn = document.getElementById("treatBtn");
    const parallaxBtn = document.getElementById("parallaxBtn");
    const wakeBtn = document.getElementById("wakeBtn");

    const video = document.getElementById("sourceVideo");
    const canvas = document.getElementById("marronCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const parallaxLevels = [
      { label: "👁️ 視差: 弱", amp: 3.5, speed: 0.0018 },
      { label: "👁️ 視差: 中", amp: 7.0, speed: 0.0022 },
      { label: "👁️ 視差: OFF", amp: 0, speed: 0 }
    ];
    let parallaxIdx = 0;

    let wakeLock = null;
    let bubbleTimer = null;

    function showBubble(text) {
      bubble.textContent = text;
      bubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 2400);
    }

    function bounceMarron() {
      canvas.classList.remove("bounce");
      void canvas.offsetWidth;
      canvas.classList.add("bounce");
    }

    function getAutoSlot(hour) {
      if (hour >= 5 && hour < 10) return "morning";
      if (hour >= 10 && hour < 16) return "day";
      if (hour >= 16 && hour < 19) return "sunset";
      if (hour >= 19 && hour < 23) return "night";
      return "midnight";
    }

    function updateClockAndRoom() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      clockText.textContent = `${hh}:${mm}`;

      const mode = timeMode.value === "auto" ? getAutoSlot(now.getHours()) : timeMode.value;
      const nextSrc = ASSETS.rooms[mode] || ASSETS.rooms.day;
      if (roomImg.getAttribute("src") !== nextSrc) {
        roomImg.src = nextSrc;
      }
    }

    function renderChromaKey() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          if (b > 95 && b - Math.max(r, g) > 35) {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(renderChromaKey);
    }

    // ジャイロを使わず、奥の部屋と手前のマロンで左右の視差オフセットを微動させる
    function animateStereoShift(nowMs) {
      const level = parallaxLevels[parallaxIdx];
      const wave = Math.sin(nowMs * level.speed);
      const roomShift = (-wave * level.amp * 0.6).toFixed(2);
      const marronShift = (wave * level.amp).toFixed(2);

      roomImg.style.transform = `translate3d(${roomShift}px, 0px, 0px) scale(1.04)`;
      canvas.style.setProperty("--mx", `${marronShift}px`);
      if (!canvas.classList.contains("bounce")) {
        canvas.style.transform = `translate3d(calc(-50% + ${marronShift}px), 0px, 0px)`;
      }
      requestAnimationFrame(animateStereoShift);
    }

    parallaxBtn.addEventListener("click", () => {
      parallaxIdx = (parallaxIdx + 1) % parallaxLevels.length;
      parallaxBtn.textContent = parallaxLevels[parallaxIdx].label;
      showBubble(parallaxLevels[parallaxIdx].label.replace("👁️ ", "") + " に切り替えたよ");
    });

    wakeBtn.addEventListener("click", async () => {
      try {
        if (!("wakeLock" in navigator)) {
          showBubble("このブラウザはスリープ防止に非対応だよ");
          return;
        }
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeBtn.textContent = "☀️ 常時ON中";
          showBubble("画面を起こしたまま一緒にいるね");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            wakeBtn.textContent = "☀️ 画面常時ON";
          });
        } else {
          await wakeLock.release();
        }
      } catch (err) {
        showBubble("スリープ防止をONにできなかったよ");
      }
    });

    petBtn.addEventListener("click", () => {
      bounceMarron();
      showBubble("なでなで嬉しいな〜♪");
    });

    treatBtn.addEventListener("click", () => {
      bounceMarron();
      showBubble("おやつだ〜！モグモグ…おいしいワン！");
    });

    timeMode.addEventListener("change", updateClockAndRoom);

    updateClockAndRoom();
    setInterval(updateClockAndRoom, 15000);
    video.play().catch(() => {});
    renderChromaKey();
    requestAnimationFrame(animateStereoShift);
  </script>
</body>
</html>
