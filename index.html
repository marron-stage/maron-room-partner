<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>マロンのお部屋パートナー</title>
  <style>
    :root {
      --glass-bg: rgba(32, 24, 18, 0.56);
      --glass-border: rgba(255, 236, 208, 0.32);
      --text: #fffaf2;
      --accent: #f6b963;
      --bubble-bg: rgba(255, 250, 240, 0.96);
      --bubble-text: #4a3525;
      --bubble-border: #e6c39c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #14100d;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    /* 横画面推奨案内（縦画面時に表示） */
    .portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 13, 0.96);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }

    @media (orientation: portrait) {
      .portrait-warning {
        display: flex;
      }
    }

    /* パスコードロック画面 (9648) */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #382a20 0%, #1a130e 100%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      transition: opacity 0.4s ease;
    }

    .lock-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lock-card {
      background: rgba(255, 248, 238, 0.08);
      border: 1.5px solid rgba(255, 224, 182, 0.25);
      border-radius: 28px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .lock-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffe8c8;
      letter-spacing: 0.05em;
    }

    .lock-dots {
      display: flex;
      gap: 14px;
      margin: 4px 0;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #f6b963;
      background: transparent;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .dot.filled {
      background: #f6b963;
      transform: scale(1.15);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 66px);
      gap: 10px;
    }

    .key-btn {
      height: 48px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 247, 235, 0.14);
      border: 1.5px solid rgba(255, 224, 182, 0.28);
      color: #fff6e9;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .key-btn:active {
      background: rgba(246, 185, 99, 0.45);
      transform: translateY(2px) scale(0.96);
    }

    .lock-msg {
      height: 18px;
      font-size: 12.5px;
      color: #ffab91;
    }

    /* メインステージ（多層奥行きコンテナ） */
    .full-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      perspective: 1100px;
    }

    /* 背景レイヤー */
    .room-layer {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.8s ease;
      filter: contrast(0.98) brightness(0.97);
      will-change: transform;
    }

    /* 立体接地影（カーペットの上に落ちる自然な影） */
    .marron-floor-shadow {
      position: absolute;
      left: 60%;
      bottom: calc(6.5% + env(safe-area-inset-bottom));
      width: 210px;
      height: 44px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(38, 22, 10, 0.46) 0%, rgba(38, 22, 10, 0.18) 52%, rgba(38, 22, 10, 0) 76%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      transition: width 0.25s ease, bottom 0.25s ease, opacity 0.2s ease;
      will-change: transform;
    }

    /* マロン本体（9:16縦長動画用：70vh） */
    .marron-canvas {
      position: absolute;
      left: 60%;
      bottom: calc(1.5% + env(safe-area-inset-bottom));
      width: auto;
      height: 70vh;
      transform: translateX(-50%);
      transform-origin: center bottom;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      z-index: 4;
      filter: drop-shadow(0 10px 12px rgba(28, 16, 8, 0.42)) drop-shadow(0 2px 3px rgba(28, 16, 8, 0.25));
      will-change: transform;
    }

    /* 16:9横長動画用 */
    .marron-canvas.is-wide {
      height: 45vh;
      bottom: calc(6% + env(safe-area-inset-bottom));
    }

    /* 8の字歩き（trot）は小ぶりに描かれているため大きく表示 */
    .marron-canvas.is-trot {
      height: 68vh;
      bottom: calc(3% + env(safe-area-inset-bottom));
    }

    /* クッション丸まり（cushion）は少し小さめ（46vh） */
    .marron-canvas.is-cushion {
      height: 46vh;
      bottom: calc(5.5% + env(safe-area-inset-bottom));
    }

    /* 画面ペロペロ（lick） */
    .marron-canvas.is-licking {
      left: 60%;
      bottom: calc(6% + env(safe-area-inset-bottom));
      width: auto;
      height: 49vh;
      transform: translateX(-50%);
      transform-origin: center bottom;
      z-index: 4;
    }

    /* ミッドナイト（ベッド）時はカーペット中央に配置 */
    .marron-canvas.is-sleeping {
      left: 62%;
      bottom: calc(1% + env(safe-area-inset-bottom));
      height: 52vh;
    }

    .marron-canvas:active {
      cursor: grabbing;
    }

    /* 上から降ってくるおやつアニメーション */
    .falling-treat {
      position: absolute;
      left: 60%;
      top: 12%;
      font-size: 36px;
      pointer-events: none;
      z-index: 14;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35));
      animation: dropTreatAnim 0.95s cubic-bezier(0.32, 0.94, 0.6, 1) forwards;
    }

    @keyframes dropTreatAnim {
      0% {
        opacity: 0;
        transform: translate(-50%, -60px) rotate(-25deg) scale(0.8);
      }
      20% {
        opacity: 1;
      }
      75% {
        opacity: 1;
        transform: translate(-50%, 38vh) rotate(15deg) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 44vh) rotate(25deg) scale(0.6);
      }
    }

    /* なでなで時のハート・肉球エフェクト */
    .pet-particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      z-index: 15;
      animation: floatUpParticle 0.95s ease-out forwards;
    }

    @keyframes floatUpParticle {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.7);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -32px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -62px) scale(0.95);
      }
    }

    /* おしゃれな上部HUD */
    .top-bar {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .clock-card {
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--glass-border);
      border-radius: 20px;
      padding: 8px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .clock-date {
      font-size: 11px;
      font-weight: 600;
      color: #f3d5ad;
      letter-spacing: 0.06em;
      opacity: 0.92;
    }

    .clock-time {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: #fffaf2;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .top-controls {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button.pill-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease;
    }

    button.pill-btn:active {
      transform: scale(0.94);
    }

    button.pill-btn.active {
      background: rgba(246, 185, 99, 0.34);
      border-color: rgba(255, 214, 153, 0.78);
      color: #fff3dc;
    }

    button.pill-btn.treat-btn {
      background: rgba(246, 185, 99, 0.26);
      border-color: rgba(255, 214, 153, 0.65);
    }

    button.pill-btn.mic-listening {
      background: rgba(255, 112, 82, 0.52);
      border-color: rgba(255, 196, 178, 0.9);
      animation: micPulse 1.1s infinite ease-in-out;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* コンパクトな選択式コントロールバー（左下：トグル＋セレクト式） */
    .compact-dock {
      position: absolute;
      left: 16px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 12;
    }

    .dock-toggle-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.14s ease, background 0.2s ease;
    }

    .dock-toggle-btn:active {
      transform: scale(0.94);
    }

    .dock-selectors {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dock-selectors.collapsed {
      display: none;
    }

    .glass-select {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 248, 238, 0.12);
      color: #fffaf2;
      border: 1px solid rgba(255, 224, 182, 0.35);
      border-radius: 999px;
      padding: 6px 26px 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffe8c8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 13px;
    }

    .glass-select option {
      background: #261c15;
      color: #fffaf2;
    }

    /* おしゃべりテキスト補助＆APIキー設定パネル */
    .chat-panel {
      position: absolute;
      right: 18px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px 8px 5px 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      z-index: 15;
    }

    .chat-panel.show {
      display: flex;
    }

    .chat-input {
      background: transparent;
      border: none;
      color: #fffaf2;
      font-size: 12.5px;
      width: 190px;
      outline: none;
      user-select: text;
    }

    .chat-input::placeholder {
      color: rgba(255, 240, 218, 0.65);
    }

    .chat-send-btn, .chat-close-btn {
      background: rgba(246, 185, 99, 0.35);
      border: 1px solid rgba(255, 224, 182, 0.45);
      color: #fffaf2;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .api-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 11, 8, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 600;
      padding: 16px;
    }

    .api-modal.show {
      display: flex;
    }

    .api-card {
      width: 100%;
      max-width: 390px;
      background: #281e17;
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    }

    .api-card-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffe8c8;
    }

    .api-card-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #e2cfb6;
    }

    .api-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 224, 182, 0.35);
      background: rgba(255, 250, 240, 0.1);
      color: #fffaf2;
      font-size: 13px;
      outline: none;
      user-select: text;
    }

    .api-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* しっぽ付きの可愛い吹き出しデザイン */
    .reaction-bubble {
      position: absolute;
      top: calc(27% + env(safe-area-inset-top));
      left: 60%;
      max-width: 340px;
      transform: translateX(-50%) scale(0.88);
      background: var(--bubble-bg);
      color: var(--bubble-text);
      border: 2.5px solid var(--bubble-border);
      border-radius: 22px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.45;
      white-space: normal;
      text-align: center;
      box-shadow: 0 6px 18px rgba(45, 28, 14, 0.22);
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 12;
      pointer-events: none;
    }

    .reaction-bubble::before {
      content: "";
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 9px 0;
      border-style: solid;
      border-color: var(--bubble-border) transparent transparent;
    }

    .reaction-bubble::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 7px 0;
      border-style: solid;
      border-color: var(--bubble-bg) transparent transparent;
    }

    .reaction-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    video#sourceVideo {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 縦画面時の案内 -->
  <div class="portrait-warning">
    <div style="font-size: 36px;">📱🔄</div>
    <div style="font-size: 17px; font-weight: 700;">iPadを横向きにしてね</div>
    <div style="font-size: 13px; color: #c8b9a6;">マロンのお部屋パートナーは横画面専用です</div>
  </div>

  <!-- パスコードロック画面 (9648) -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-title">🐾 マロンのお部屋へようこそ</div>
      <div class="lock-dots" id="lockDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="lock-msg" id="lockMsg"></div>
      <div class="keypad" id="keypad">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn" data-key="C" style="font-size:13px;">クリア</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn" data-key="BS" style="font-size:14px;">⌫</button>
      </div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div class="full-stage" id="stage">
    <img id="roomImg" class="room-layer" src="assets/room_day.jpg" alt="マロンのお部屋" />
    <div class="marron-floor-shadow" id="floorShadow"></div>
    <canvas id="marronCanvas" class="marron-canvas"></canvas>

    <div class="top-bar">
      <div class="clock-card">
        <div class="clock-date" id="clockDate">--/-- (---)</div>
        <div class="clock-time" id="clockTime">--:--</div>
      </div>

      <div class="top-controls">
        <button class="pill-btn treat-btn" id="treatBtn">🦴 おやつ</button>
        <button class="pill-btn" id="micBtn">🎤 話す</button>
        <button class="pill-btn" id="textChatToggleBtn">💬 入力</button>
        <button class="pill-btn" id="apiKeyBtn">🔑 APIキー</button>
        <button class="pill-btn active" id="depthBtn">✨ 立体・ジャイロ: ON</button>
        <button class="pill-btn active" id="bgmToggleBtn">🎵 BGM: ON</button>
        <button class="pill-btn" id="wakeBtn">☀️ 画面常時ON</button>
      </div>
    </div>

    <!-- シンプルな選択式コントロールバー（トグル開閉 ＋ プルダウン選択） -->
    <div class="compact-dock">
      <button class="dock-toggle-btn" id="dockToggleBtn">🎛️ 操作</button>
      <div class="dock-selectors" id="dockSelectors">
        <select class="glass-select" id="timeSelect" aria-label="時間帯選択">
          <option value="auto">🕒 時間帯: 自動</option>
          <option value="morning">🌅 朝</option>
          <option value="day">☀️ 昼</option>
          <option value="sunset">🌇 夕方</option>
          <option value="night">🌙 夜</option>
          <option value="midnight">🌌 深夜</option>
        </select>

        <select class="glass-select" id="motionSelect" aria-label="行動選択">
          <option value="sit">🐾 行動: おすわり</option>
          <option value="down">🛋️ 伏せ</option>
          <option value="cushion">🛏️ クッション丸まり</option>
          <option value="hop">🐇 ぴょんぴょん接近</option>
          <option value="beg">🥺 首かしげおねだり</option>
          <option value="back">🐕 後ろ姿トコトコ</option>
          <option value="bark">🗣️ 吠える</option>
          <option value="sweet">💕 甘え</option>
          <option value="treat">🦴 おやつ</option>
          <option value="spin">🌀 回転</option>
          <option value="trot">🚶 8の字散歩</option>
          <option value="stretch">🥱 背伸び(あくび)</option>
          <option value="trick">🎪 芸(お腹)</option>
          <option value="lick">👅 ペロペロ</option>
          <option value="pet">✋ なでなで</option>
          <option value="sleep">💤 睡眠</option>
        </select>
      </div>
    </div>

    <!-- 文字入力補助パネル -->
    <div class="chat-panel" id="chatPanel">
      <input type="text" class="chat-input" id="chatInput" placeholder="マロンに話しかける..." />
      <button class="chat-send-btn" id="chatSendBtn">送信</button>
      <button class="chat-close-btn" id="chatCloseBtn">×</button>
    </div>

    <div class="reaction-bubble" id="bubble">ワンワン！</div>
  </div>

  <!-- Gemini APIキー設定モーダル（iPadブラウザのlocalStorageに保存） -->
  <div class="api-modal" id="apiModal">
    <div class="api-card">
      <div class="api-card-title">🔑 Gemini APIキー設定</div>
      <div class="api-card-desc">

    // ---------------------------------------------------------
    // ジャイロ視差 ＋ 指ドラッグ視差 ＋ 多層レイヤー ＋ 微細な呼吸揺らぎ
    // ---------------------------------------------------------
    let depthEnabled = true;
    let gyroParallaxX = 0;
    let gyroParallaxY = 0;
    let gyroBaselineBeta = null;
    let gyroBaselineGamma = null;
    let gyroListenerAttached = false;

    let dragParallaxX = 0;
    let dragParallaxY = 0;
    let smoothParallaxX = 0;
    let smoothParallaxY = 0;

    function handleDeviceOrientation(e) {
      if (!depthEnabled || e.beta === null || e.gamma === null) return;
      if (gyroBaselineBeta === null || gyroBaselineGamma === null) {
        gyroBaselineBeta = e.beta;
        gyroBaselineGamma = e.gamma;
      } else {
        gyroBaselineBeta += (e.beta - gyroBaselineBeta) * 0.015;
        gyroBaselineGamma += (e.gamma - gyroBaselineGamma) * 0.015;
      }

      const dBeta = e.beta - gyroBaselineBeta;
      const dGamma = e.gamma - gyroBaselineGamma;

      const isLandscape = window.innerWidth >= window.innerHeight;
      const rawX = isLandscape ? dBeta : dGamma;
      const rawY = isLandscape ? -dGamma : dBeta;

      gyroParallaxX = Math.max(-1, Math.min(1, rawX / 16));
      gyroParallaxY = Math.max(-1, Math.min(1, rawY / 16));
    }

    function attachGyroListener() {
      if (gyroListenerAttached) return;
      window.addEventListener("deviceorientation", handleDeviceOrientation, true);
      gyroListenerAttached = true;
    }

    async function requestGyroPermissionIfNeeded() {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === "granted") {
            gyroBaselineBeta = null;
            gyroBaselineGamma = null;
            attachGyroListener();
          }
        } else {
          attachGyroListener();
        }
      } catch (err) {}
    }

    function updateDragParallaxFromPointer(clientX, clientY) {
      if (!depthEnabled) return;
      const rect = stage.getBoundingClientRect();
      const nx = ((clientX - rect.left) / Math.max(rect.width, 1)) * 2 - 1;
      const ny = ((clientY - rect.top) / Math.max(rect.height, 1)) * 2 - 1;
      dragParallaxX = Math.max(-1, Math.min(1, nx));
      dragParallaxY = Math.max(-1, Math.min(1, ny));
    }

    function resetDragParallax() {
      dragParallaxX = 0;
      dragParallaxY = 0;
    }

    function applyMultiLayerDepth() {
      if (!depthEnabled) {
        roomImg.style.transform = "";
        canvas.style.transform = "translateX(-50%)";
        floorShadow.style.transform = "translateX(-50%)";
        requestAnimationFrame(applyMultiLayerDepth);
        return;
      }

      const combinedTargetX = Math.max(-1.2, Math.min(1.2, gyroParallaxX + dragParallaxX));
      const combinedTargetY = Math.max(-1.2, Math.min(1.2, gyroParallaxY + dragParallaxY));

      smoothParallaxX += (combinedTargetX - smoothParallaxX) * (isPointerDown ? 0.16 : 0.08);
      smoothParallaxY += (combinedTargetY - smoothParallaxY) * (isPointerDown ? 0.16 : 0.08);

      const t = performance.now() * 0.0014;
      const breathRate = currentMotion === "sleep" ? 0.65 : 1.0;
      const breathScale = 1 + Math.sin(t * breathRate) * (currentMotion === "sleep" ? 0.012 : 0.008);
      const breathY = Math.cos(t * breathRate * 0.8) * 1.5;
      const idleDriftX = Math.sin(t * 0.45) * 2.2;

      const bgX = -(smoothParallaxX * 16 + idleDriftX * 0.6);
      const bgY = -(smoothParallaxY * 9);

      const fgX = smoothParallaxX * 9 + idleDriftX;
      const fgY = smoothParallaxY * 4.5 + breathY;
      const fgTilt = smoothParallaxX * 2.4;

      const shadowX = smoothParallaxX * 6.5 + idleDriftX * 0.8;
      const shadowScale = 1 - Math.sin(t * breathRate) * 0.015;

      roomImg.style.transform = `translate3d(${bgX.toFixed(1)}px, ${bgY.toFixed(1)}px, 0) scale(1.05)`;
      canvas.style.transform = `translate3d(calc(-50% + ${fgX.toFixed(1)}px), ${fgY.toFixed(1)}px, 0) scale(${breathScale.toFixed(4)}) rotate(${fgTilt.toFixed(2)}deg)`;
      floorShadow.style.transform = `translate3d(calc(-50% + ${shadowX.toFixed(1)}px), 0, 0) scale(${shadowScale.toFixed(4)})`;

      requestAnimationFrame(applyMultiLayerDepth);
    }

    // Web Audio API（BGM ＋ 動画音声を同一ミキサーに統合）
    // ---------------------------------------------------------
    let audioCtx = null;
    let bgmGainNode = null;
    let videoGainNode = null;
    let videoMediaSource = null;
    let bgmSourceNode = null;
    const bgmBufferCache = {};
    let bgmLoadToken = 0;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
        bgmGainNode.connect(audioCtx.destination);

        try {
          videoGainNode = audioCtx.createGain();
          videoGainNode.gain.value = 1.0;
          videoMediaSource = audioCtx.createMediaElementSource(video);
          videoMediaSource.connect(videoGainNode);
          videoGainNode.connect(audioCtx.destination);
        } catch (e) {}
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function playPetHapticPulse() {
      if (!audioCtx || audioCtx.state !== "running") return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(75, now);
        osc.frequency.exponentialRampToValueAtTime(44, now + 0.06);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.38, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function stopBgmNode() {
      if (bgmSourceNode) {
        try {
          bgmSourceNode.stop();
          bgmSourceNode.disconnect();
        } catch (e) {}
        bgmSourceNode = null;
      }
    }

    async function playSlotBgm(bgmUrl) {
      if (!isUnlocked) return;
      initAudioContext();
      const token = ++bgmLoadToken;
      stopBgmNode();

      try {
        let buffer = bgmBufferCache[bgmUrl];
        if (!buffer) {
          const response = await fetch(bgmUrl);
          const arrayBuffer = await response.arrayBuffer();
          buffer = await audioCtx.decodeAudioData(arrayBuffer);
          bgmBufferCache[bgmUrl] = buffer;
        }
        if (token !== bgmLoadToken) return;

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(bgmGainNode);
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
        source.start(0);
        bgmSourceNode = source;
      } catch (err) {
        console.warn("BGM再生エラー:", err);
      }
    }

    textChatToggleBtn.addEventListener("click", () => {
      chatPanel.classList.toggle("show");
      if (chatPanel.classList.contains("show")) {
        chatInput.focus();
      }
    });

    chatCloseBtn.addEventListener("click", () => {
      chatPanel.classList.remove("show");
    });

    async function sendTextChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      await talkWithMarronGemini(text);
    }

    chatSendBtn.addEventListener("click", sendTextChat);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendTextChat();
      }
    });

    // ブラウザ音声認識（iPadOS Safari / Chrome）
    const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecognizing = false;

    if (SpeechRecognitionClass) {
      recognition = new SpeechRecognitionClass();
      recognition.lang = "ja-JP";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecognizing = true;
        micBtn.classList.add("mic-listening");
        micBtn.textContent = "🎙️ 聞き中...";
        playMotion("beg", { customText: "ん？なあに？（お耳を傾けているよ…）" });
      };

      recognition.onresult = async (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript?.trim();
        if (transcript) {
          await talkWithMarronGemini(transcript);
        } else {
          showBubble("ん？うまく聞き取れなかったワン…");
        }
      };

      recognition.onerror = (event) => {
        if (event.error !== "no-speech") {
          showBubble("マイクが使えなかったみたい…💬入力も使えるよ！");
        }
      };

      recognition.onend = () => {
        isRecognizing = false;
        micBtn.classList.remove("mic-listening");
        micBtn.textContent = "🎤 話す";
        initAudioContext();
      };
    }

    micBtn.addEventListener("click", () => {
      if (!isUnlocked) return;
      initAudioContext();

      if (!getSavedApiKey()) {
        apiKeyInput.value = "";
        apiModal.classList.add("show");
        showBubble("先にGeminiのAPIキーを入れてね！");
        return;
      }

      if (!recognition) {
        chatPanel.classList.add("show");
        chatInput.focus();
        showBubble("このブラウザは音声入力に非対応だから文字で話そう！");
        return;
      }

      if (isRecognizing) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (err) {
          showBubble("もう一回マイクボタンを押してみてね");
        }
      }
    });

    async function talkWithMarronGemini(userText) {
      if (!isUnlocked) return;
      initAudioContext();

      const apiKey = getSavedApiKey();
      if (!apiKey) {
        apiKeyInput.value = "";
        apiModal.classList.add("show");
        showBubble("GeminiのAPIキーを設定してね！");
        return;
      }

      clearTimeout(randomMotionTimer);
      showBubble("…（お耳をぴこんと立てて考え中）", 5000);

      const slotLabel = (ASSETS.slots[currentSlot] && ASSETS.slots[currentSlot].label) || "昼";
      const systemInstruction = [
        "あなたは二頭身の黒柴の子犬キャラクター「マロン」です。",
        "飼い主さんの言葉に、優しく人懐っこく、少し甘えん坊な子犬らしい短い日本語（全角45文字以内目安）で返事をしてください。",
        "「ワン」「〜だワン」「クゥン」などの犬らしいニュアンスを自然に混ぜつつ、丁寧すぎず温かみのある口調にしてください。",
        "出力は必ずJSON形式のみで返してください: {\"reply\":\"吹き出しに表示する短い返事\",\"motion\":\"bark|sweet|beg|trick|hop\"}"
      ].join("\n");

      const promptText = `現在の時間帯は「${slotLabel}」です。飼い主さんが「${userText}」と話しかけました。`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(GEMINI_MODEL_NAME)}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents: [{ role: "user", parts: [{ text: promptText }] }],
            generationConfig: {
              temperature: 0.85,
              maxOutputTokens: 160,
              responseMimeType: "application/json"
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";

        let replyText = "ワンワン！そばにいるよ〜♪";
        let chosenMotion = "bark";

        try {
          const parsed = JSON.parse(rawText);
          if (parsed.reply) replyText = String(parsed.reply).slice(0, 80);
          const allowed = ["bark", "sweet", "beg", "trick", "hop"];
          if (parsed.motion && allowed.includes(parsed.motion)) {
            chosenMotion = parsed.motion;
          }
        } catch (parseErr) {
          if (rawText.trim()) {
            replyText = rawText.trim().slice(0, 70);
          }
        }

        // 鳴き声・動きのあるモーション動画と吹き出しを同時再生
        playMotion(chosenMotion, { customText: replyText });
      } catch (err) {
        console.warn("Gemini通信エラー:", err);
        playMotion("sweet", { customText: "クゥ〜ン…うまくお返事できなかったワン…APIキーを確認してみてね" });
      }
    }

    // ---------------------------------------------------------
    // おやつ・時計・モーション制御
    // ---------------------------------------------------------
    function dropTreatAndEat() {
      if (!isUnlocked) return;
      initAudioContext();

      if (currentSlot === "midnight") {
        showBubble("Zzz…むにゃむにゃ…（おやつの夢を見てるよ）");
        return;
      }

      clearTimeout(randomMotionTimer);

      const treatEl = document.createElement("div");
      treatEl.className = "falling-treat";
      treatEl.textContent = "🦴";
      stage.appendChild(treatEl);
      setTimeout(() => treatEl.remove(), 960);

      setTimeout(() => {
        playMotion("treat", { customText: "わーい！おやつだ！待て…よしっ！パクッ♪" });
      }, 320);
    }

    treatBtn.addEventListener("click", dropTreatAndEat);

    function getAutoSlot(hour) {
      if (hour >= 5 && hour < 10) return "morning";
      if (hour >= 10 && hour < 16) return "day";
      if (hour >= 16 && hour < 19) return "sunset";
      if (hour >= 19 && hour < 23) return "night";
      return "midnight";
    }

    const WEEKDAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

    function syncClockRoomAndBgm(isManualTest = false) {
      const now = new Date();
      const mon = now.getMonth() + 1;
      const day = now.getDate();
      const wday = WEEKDAYS[now.getDay()];
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");

      clockDate.textContent = `${mon}/${day} (${wday})`;
      clockTime.textContent = `${hh}:${mm}`;

      const slot = forcedSlot === "auto" ? getAutoSlot(now.getHours()) : forcedSlot;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;

      if (roomImg.getAttribute("src") !== asset.room) {
        roomImg.src = asset.room;
      }

      if (currentSlot !== slot) {
        const prevSlot = currentSlot;
        currentSlot = slot;

        if (isUnlocked) {
          playSlotBgm(asset.bgm);

          if (slot === "midnight") {
            clearTimeout(randomMotionTimer);
            clearTimeout(idleChatTimer);
            playMotion("sleep", { customText: "すやすや…おやすみなさい…", silentBubble: prevSlot === "" });
          } else {
            scheduleIdleChat();
            if (prevSlot === "midnight") {
              playMotion("bark", { customText: "ワン！おはよう〜！" });
            } else if (isManualTest) {
              const tLines = ASSETS.timeLines[slot];
              const extra = tLines ? tLines[Math.floor(Math.random() * tLines.length)] : "";
              showBubble(`【${asset.label}】${extra || "時間帯を切り替えたよ！"}`);
            }
          }
        }
      }
    }

    function fadeInVideoAudio() {
      if (!audioCtx || !videoGainNode) return;
      try {
        const now = audioCtx.currentTime;
        videoGainNode.gain.cancelScheduledValues(now);
        videoGainNode.gain.setValueAtTime(0.001, now);
        videoGainNode.gain.linearRampToValueAtTime(1.0, now + 0.06);
      } catch (e) {}
    }

    function playMotion(motionKey, { customText = null, silentBubble = false, loopOverride = null } = {}) {
      const motion = ASSETS.motions[motionKey];
      if (!motion) return;

      currentMotion = motionKey;
      if (motionSelect.value !== motionKey) {
        motionSelect.value = motionKey;
      }

      if (motionKey !== "sit" && motionKey !== "sleep" && motionKey !== "pet") {
        lastOneAction = motionKey;
      }

      canvas.classList.toggle("is-sleeping", motionKey === "sleep");
      canvas.classList.toggle("is-licking", motionKey === "lick");
      canvas.classList.toggle("is-trot", motionKey === "trot");
      canvas.classList.toggle("is-cushion", motionKey === "cushion");
      floorShadow.style.opacity = "1";

      fadeInVideoAudio();
      video.loop = loopOverride !== null ? loopOverride : motion.loop;
      video.src = motion.src;
      video.play().catch(() => {});

      if (!silentBubble) {
        const text = customText !== null
          ? customText
          : motion.lines[Math.floor(Math.random() * motion.lines.length)];
        showBubble(text);
      }

      if (motionKey === "sit" && currentSlot !== "midnight") {
        scheduleNextOneAction(15000, 25000);
      } else if (motionKey === "down" && currentSlot !== "midnight") {
        clearTimeout(randomMotionTimer);
        const restDelay = 12000 + Math.floor(Math.random() * 6000);
        randomMotionTimer = setTimeout(() => {
          if (isUnlocked && !isPointerDown && currentMotion === "down" && currentSlot !== "midnight") {
            playMotion("sit", { silentBubble: true });
          }
        }, restDelay);
      }
    }

    video.addEventListener("ended", () => {
      if (!video.loop) {
        if (currentSlot === "midnight") {
          playMotion("sleep", { silentBubble: true });
        } else {
          playMotion("sit", { silentBubble: true });
        }
      }
    });

    function scheduleNextOneAction(minMs = 15000, maxMs = 25000) {
      clearTimeout(randomMotionTimer);
      if (!isUnlocked || currentSlot === "midnight") return;

      const nextDelay = minMs + Math.floor(Math.random() * (maxMs - minMs));
      randomMotionTimer = setTimeout(() => {
        if (!isUnlocked || isPointerDown || currentSlot === "midnight") return;
        if (currentMotion !== "sit") return;

        const candidates = RANDOM_ONE_ACTIONS.filter((k) => k !== lastOneAction);
        const nextKey = candidates[Math.floor(Math.random() * candidates.length)];
        playMotion(nextKey);
      }, nextDelay);
    }

    let isPointerDown = false;
    let strokeDistance = 0;
    let lastPos = null;
    let lastParticleTime = 0;
    let lastHapticTime = 0;
    let petTriggeredInStroke = false;

    canvas.addEventListener("pointerdown", (e) => {
      if (!isUnlocked) return;
      initAudioContext();
      if (depthEnabled && !gyroListenerAttached) {
        requestGyroPermissionIfNeeded();
      }
      scheduleIdleChat();
      isPointerDown = true;
      strokeDistance = 0;
      petTriggeredInStroke = false;
      lastPos = { x: e.clientX, y: e.clientY };
      updateDragParallaxFromPointer(e.clientX, e.clientY);
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!isPointerDown || !lastPos || !isUnlocked) return;
      const dx = e.clientX - lastPos.x;
      const dy = e.clientY - lastPos.y;
      const step = Math.hypot(dx, dy);
      strokeDistance += step;
      lastPos = { x: e.clientX, y: e.clientY };
      updateDragParallaxFromPointer(e.clientX, e.clientY);

      const now = Date.now();

      if (step > 1.2 && now - lastHapticTime > 70) {
        lastHapticTime = now;
        playPetHapticPulse();
      }

      if (strokeDistance > 12 && now - lastParticleTime > 150) {
        lastParticleTime = now;
        spawnPetParticle(e.clientX, e.clientY);
      }

      if (strokeDistance > 24 && !petTriggeredInStroke) {
        petTriggeredInStroke = true;
        clearTimeout(randomMotionTimer);
        if (currentSlot === "midnight") {
          showBubble("んぅ…なでなで…すやすや…");
        } else {
          playMotion("pet", { loopOverride: true });
        }
      }
    });

    function endPointerStroke(e) {
      if (!isPointerDown) return;

      if (petTriggeredInStroke) {
        if (currentSlot === "midnight") {
          playMotion("sleep", { silentBubble: true });
        } else {
          playMotion("sit", { silentBubble: true });
        }
      } else if (strokeDistance <= 14 && isUnlocked) {
        spawnPetParticle(e.clientX, e.clientY);
        if (currentSlot === "midnight") {
          showBubble("Zzz…むにゃむにゃ…");
        } else {
          clearTimeout(randomMotionTimer);
          const tapActions = ["hop", "beg", "bark", "trick", "lick", "spin", "stretch"];
          const candidates = tapActions.filter((k) => k !== lastOneAction);
          const nextKey = candidates[Math.floor(Math.random() * candidates.length)];
          playMotion(nextKey);
        }
      }

      isPointerDown = false;
      petTriggeredInStroke = false;
      lastPos = null;
      resetDragParallax();
    }

    canvas.addEventListener("pointerup", endPointerStroke);
    canvas.addEventListener("pointercancel", endPointerStroke);

    function renderChromaKey() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          const isWideVideo = video.videoWidth > video.videoHeight;
          canvas.classList.toggle("is-wide", isWideVideo);
          floorShadow.style.width = isWideVideo ? "230px" : "200px";
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          if (b > 95 && b - Math.max(r, g) > 35) {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(renderChromaKey);
    }

    function startAppAfterUnlock() {
      initAudioContext();
      const slot = forcedSlot === "auto" ? getAutoSlot(new Date().getHours()) : forcedSlot;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;
      currentSlot = slot;
      roomImg.src = asset.room;
      playSlotBgm(asset.bgm);

      video.muted = false;
      video.volume = 1.0;

      if (slot === "midnight") {
        playMotion("sleep", { customText: "すやすや…もう夜遅いよ…Zzz" });
      } else {
        scheduleIdleChat();
        playMotion("bark", { customText: "ワンワン！（おかえり〜！）" });
      }
    }

    bgmToggleBtn.addEventListener("click", () => {
      bgmEnabled = !bgmEnabled;
      initAudioContext();
      if (bgmGainNode) {
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
      }
      bgmToggleBtn.textContent = bgmEnabled ? "🎵 BGM: ON" : "🔇 BGM: OFF";
      bgmToggleBtn.classList.toggle("active", bgmEnabled);
    });

    wakeBtn.addEventListener("click", async () => {
      try {
        if (!("wakeLock" in navigator)) {
          showBubble("このブラウザはスリープ防止に非対応だよ");
          return;
        }
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeBtn.textContent = "☀️ 常時ON中";
          wakeBtn.classList.add("active");
          showBubble("画面を起こしたまま一緒にいるね");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            wakeBtn.textContent = "☀️ 画面常時ON";
            wakeBtn.classList.remove("active");
          });
        } else {
          await wakeLock.release();
        }
      } catch (err) {
        showBubble("スリープ防止をONにできなかったよ");
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!audioCtx || !isUnlocked) return;
      if (document.hidden) {
        audioCtx.suspend().catch(() => {});
      } else {
        audioCtx.resume().catch(() => {});
      }
    });

    syncClockRoomAndBgm();
    setInterval(() => syncClockRoomAndBgm(false), 10000);
    video.muted = true;
    video.play().catch(() => {});
    renderChromaKey();
    applyMultiLayerDepth();
  </script>
</body>
</html>
