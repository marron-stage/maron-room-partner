<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>マロンのお部屋パートナー</title>
  <style>
    :root {
      --panel: rgba(34, 26, 20, 0.72);
      --border: rgba(255, 232, 198, 0.28);
      --text: #fff9f0;
      --accent: #f6b963;
      --bubble-bg: rgba(255, 250, 240, 0.95);
      --bubble-text: #4a3525;
      --bubble-border: #e6c39c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #14100d;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    /* 横画面推奨案内（縦画面時に表示） */
    .portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 13, 0.96);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }

    @media (orientation: portrait) {
      .portrait-warning {
        display: flex;
      }
    }

    /* パスコードロック画面（可愛いカフェ・肉球風デザイン） */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #382a20 0%, #1a130e 100%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      transition: opacity 0.4s ease;
    }

    .lock-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lock-card {
      background: rgba(255, 248, 238, 0.08);
      border: 1.5px solid rgba(255, 224, 182, 0.25);
      border-radius: 28px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .lock-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffe8c8;
      letter-spacing: 0.05em;
    }

    .lock-dots {
      display: flex;
      gap: 14px;
      margin: 4px 0;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #f6b963;
      background: transparent;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .dot.filled {
      background: #f6b963;
      transform: scale(1.15);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 66px);
      gap: 10px;
    }

    .key-btn {
      height: 48px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 247, 235, 0.14);
      border: 1.5px solid rgba(255, 224, 182, 0.28);
      color: #fff6e9;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .key-btn:active {
      background: rgba(246, 185, 99, 0.45);
      transform: translateY(2px) scale(0.96);
    }

    .lock-msg {
      height: 18px;
      font-size: 12.5px;
      color: #ffab91;
    }

    /* メインステージ（横画面16:9前提） */
    .full-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .room-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    /* ラグの上にちょうど座るサイズと位置（直接タッチ・なでなで有効） */
    .marron-canvas {
      position: absolute;
      left: 55%;
      bottom: calc(15% + env(safe-area-inset-bottom));
      width: min(21vw, 29vh, 210px);
      height: auto;
      transform: translateX(-50%);
      transform-origin: center bottom;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      z-index: 4;
    }

    .marron-canvas:active {
      cursor: grabbing;
    }

    /* なでなで時のハート・肉球エフェクト */
    .pet-particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      z-index: 15;
      animation: floatUpParticle 0.95s ease-out forwards;
    }

    @keyframes floatUpParticle {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.7);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -32px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -62px) scale(0.95);
      }
    }

    .top-bar {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clock-pill {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .time-select {
      background: var(--panel);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    /* しっぽ付きの可愛い吹き出しデザイン */
    .reaction-bubble {
      position: absolute;
      bottom: calc(15% + min(21vw, 29vh, 210px) + 12px + env(safe-area-inset-bottom));
      left: 55%;
      transform: translateX(-50%) scale(0.88);
      background: var(--bubble-bg);
      color: var(--bubble-text);
      border: 2.5px solid var(--bubble-border);
      border-radius: 22px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(45, 28, 14, 0.22);
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 12;
      pointer-events: none;
    }

    .reaction-bubble::before {
      content: "";
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 9px 0;
      border-style: solid;
      border-color: var(--bubble-border) transparent transparent;
    }

    .reaction-bubble::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 7px 0;
      border-style: solid;
      border-color: var(--bubble-bg) transparent transparent;
    }

    .reaction-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .bottom-controls {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    button.ctrl-btn {
      background: var(--panel);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button.ctrl-btn:active {
      transform: scale(0.95);
    }

    button.ctrl-btn.primary {
      background: rgba(246, 185, 99, 0.34);
      border-color: rgba(246, 185, 99, 0.78);
      color: #ffe9c4;
    }

    video#sourceVideo {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 縦画面時の案内 -->
  <div class="portrait-warning">
    <div style="font-size: 36px;">📱🔄</div>
    <div style="font-size: 17px; font-weight: 700;">iPadを横向きにしてね</div>
    <div style="font-size: 13px; color: #c8b9a6;">マロンのお部屋パートナーは横画面専用です</div>
  </div>

  <!-- パスコードロック画面 (9648) -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-title">🐾 マロンのお部屋へようこそ</div>
      <div class="lock-dots" id="lockDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="lock-msg" id="lockMsg"></div>
      <div class="keypad" id="keypad">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn" data-key="C" style="font-size:13px;">クリア</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn" data-key="BS" style="font-size:14px;">⌫</button>
      </div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div class="full-stage" id="stage">
    <img id="roomImg" class="room-layer" src="assets/room_day.jpg" alt="マロンのお部屋" />
    <canvas id="marronCanvas" class="marron-canvas"></canvas>

    <div class="top-bar">
      <div class="clock-pill" id="clockText">--:--</div>
      <div class="top-right">
        <button class="ctrl-btn" id="bgmToggleBtn">🎵 BGM: ON</button>
        <select class="time-select" id="timeMode" aria-label="時間帯モード">
          <option value="auto">時間帯: 自動</option>
          <option value="morning">朝 (morning)</option>
          <option value="day">昼 (day)</option>
          <option value="sunset">夕方 (sunset)</option>
          <option value="night">夜 (night)</option>
          <option value="midnight">深夜 (midnight)</option>
        </select>
      </div>
    </div>

    <div class="reaction-bubble" id="bubble">ワンワン！</div>

    <div class="bottom-controls">
      <button class="ctrl-btn primary" id="petBtn">🐾 なでる</button>
      <button class="ctrl-btn primary" id="treatBtn">🦴 おやつ</button>
      <button class="ctrl-btn primary" id="barkBtn">🐶 呼ぶ</button>
      <button class="ctrl-btn" id="sleepBtn">💤 おやすみ</button>
      <button class="ctrl-btn" id="wakeBtn">☀️ 画面常時ON</button>
    </div>
  </div>

  <video id="sourceVideo" src="assets/marron_sit.mp4" autoplay loop playsinline></video>

  <script>
    const PASSCODE = "9648";

    const ASSETS = {
      slots: {
        morning:  { room: "assets/room_morning.jpg",  bgm: "assets/bgm_morning.mp3" },
        day:      { room: "assets/room_day.jpg",      bgm: "assets/bgm_day.mp3" },
        sunset:   { room: "assets/room_sunset.jpg",   bgm: "assets/bgm_sunset.mp3" },
        night:    { room: "assets/room_night.jpg",    bgm: "assets/bgm_night.mp3" },
        midnight: { room: "assets/room_midnight.jpg", bgm: "assets/bgm_midnight.mp3" }
      },
      motions: {
        sit:   { src: "assets/marron_sit.mp4",   loop: true,  lines: ["ここでまったりしてるよ〜", "じーっ…（こっちを見ている）"] },
        down:  { src: "assets/marron_down.mp4",  loop: true,  lines: ["ちょっと伏せてのんびりしようっと", "床が気持ちいいな〜"] },
        sleep: { src: "assets/marron_sleep.mp4", loop: true,  lines: ["すやすや…おやすみ〜…", "うとうと…眠くなってきたワン…"] },
        pet:   { src: "assets/marron_pet.mp4",   loop: false, lines: ["なでなで気持ちいいな〜♪", "えへへ、もっと撫でて〜"] },
        sweet: { src: "assets/marron_sweet.mp4", loop: false, lines: ["おやつだ！モグモグ…おいしいワン！", "わーい！大好物だ〜！"] },
        bark:  { src: "assets/marron_bark.mp4",  loop: false, lines: ["ワンワン！", "ワン！（こっち見てるよ！）"] }
      }
    };

    // ロック画面処理
    let inputCode = "";
    let isUnlocked = false;
    const lockScreen = document.getElementById("lockScreen");
    const lockDots = document.querySelectorAll("#lockDots .dot");
    const lockMsg = document.getElementById("lockMsg");

    function updateDots() {
      lockDots.forEach((dot, idx) => {
        dot.classList.toggle("filled", idx < inputCode.length);
      });
    }

    document.getElementById("keypad").addEventListener("click", (e) => {
      const btn = e.target.closest(".key-btn");
      if (!btn || isUnlocked) return;
      const key = btn.dataset.key;

      if (key === "C") {
        inputCode = "";
        lockMsg.textContent = "";
      } else if (key === "BS") {
        inputCode = inputCode.slice(0, -1);
        lockMsg.textContent = "";
      } else if (inputCode.length < 4) {
        inputCode += key;
      }
      updateDots();

      if (inputCode.length === 4) {
        if (inputCode === PASSCODE) {
          isUnlocked = true;
          lockScreen.classList.add("hidden");
          startAppAfterUnlock();
        } else {
          lockMsg.textContent = "パスコードが違うみたい…";
          setTimeout(() => {
            inputCode = "";
            updateDots();
          }, 450);
        }
      }
    });

    // メインアプリ要素
    const stage = document.getElementById("stage");
    const roomImg = document.getElementById("roomImg");
    const clockText = document.getElementById("clockText");
    const timeMode = document.getElementById("timeMode");
    const bubble = document.getElementById("bubble");
    const bgmToggleBtn = document.getElementById("bgmToggleBtn");
    const wakeBtn = document.getElementById("wakeBtn");

    const video = document.getElementById("sourceVideo");
    const canvas = document.getElementById("marronCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let currentSlot = "";
    let currentMotion = "sit";
    let bgmEnabled = true;
    let wakeLock = null;
    let bubbleTimer = null;
    let randomMotionTimer = null;

    // Web Audio API を使ったBGM再生（動画の音声と同時再生させるため）
    let audioCtx = null;
    let bgmGainNode = null;
    let bgmSourceNode = null;
    const bgmBufferCache = {};
    let bgmLoadToken = 0;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
        bgmGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function stopBgmNode() {
      if (bgmSourceNode) {
        try {
          bgmSourceNode.stop();
          bgmSourceNode.disconnect();
        } catch (e) {}
        bgmSourceNode = null;
      }
    }

    async function playSlotBgm(bgmUrl) {
      if (!isUnlocked) return;
      initAudioContext();
      const token = ++bgmLoadToken;
      stopBgmNode();

      try {
        let buffer = bgmBufferCache[bgmUrl];
        if (!buffer) {
          const response = await fetch(bgmUrl);
          const arrayBuffer = await response.arrayBuffer();
          buffer = await audioCtx.decodeAudioData(arrayBuffer);
          bgmBufferCache[bgmUrl] = buffer;
        }
        if (token !== bgmLoadToken) return;

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(bgmGainNode);
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
        source.start(0);
        bgmSourceNode = source;
      } catch (err) {
        console.warn("BGM再生エラー:", err);
      }
    }

    function showBubble(text, duration = 2600) {
      if (!text) return;
      bubble.textContent = text;
      bubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), duration);
    }

    function spawnPetParticle(x, y) {
      const icons = ["💖", "🐾", "✨", "♪"];
      const el = document.createElement("div");
      el.className = "pet-particle";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function getAutoSlot(hour) {
      if (hour >= 5 && hour < 10) return "morning";
      if (hour >= 10 && hour < 16) return "day";
      if (hour >= 16 && hour < 19) return "sunset";
      if (hour >= 19 && hour < 23) return "night";
      return "midnight";
    }

    function syncRoomAndBgm() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      clockText.textContent = `${hh}:${mm}`;

      const slot = timeMode.value === "auto" ? getAutoSlot(now.getHours()) : timeMode.value;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;

      if (roomImg.getAttribute("src") !== asset.room) {
        roomImg.src = asset.room;
      }

      if (currentSlot !== slot) {
        currentSlot = slot;
        if (isUnlocked) {
          playSlotBgm(asset.bgm);
        }
      }
    }

    // モーション切り替え
    function playMotion(motionKey, { customText = null, silentBubble = false } = {}) {
      const motion = ASSETS.motions[motionKey];
      if (!motion) return;

      currentMotion = motionKey;
      video.loop = motion.loop;
      video.src = motion.src;
      video.load();
      video.play().catch(() => {});

      if (!silentBubble) {
        const text = customText !== null
          ? customText
          : motion.lines[Math.floor(Math.random() * motion.lines.length)];
        showBubble(text);
      }
    }

    // 単発アクション動画（bark, pet, sweet）が終わったらお座りへ戻る
    video.addEventListener("ended", () => {
      if (!video.loop) {
        playMotion("sit", { silentBubble: true });
      }
    });

    // 全6種類の動画をランダムな間隔で自由に切り替えるスケジューラー
    function scheduleNextRandomMotion() {
      clearTimeout(randomMotionTimer);
      const nextDelay = 12000 + Math.floor(Math.random() * 12000);
      randomMotionTimer = setTimeout(() => {
        if (isUnlocked) {
          const allKeys = Object.keys(ASSETS.motions);
          const candidates = allKeys.filter((k) => k !== currentMotion);
          const nextKey = candidates[Math.floor(Math.random() * candidates.length)];
          playMotion(nextKey);
        }
        scheduleNextRandomMotion();
      }, nextDelay);
    }

    // 直接指でなでなで＆タップする操作
    let isPointerDown = false;
    let strokeDistance = 0;
    let lastPos = null;
    let lastParticleTime = 0;
    let petTriggeredInStroke = false;

    canvas.addEventListener("pointerdown", (e) => {
      if (!isUnlocked) return;
      isPointerDown = true;
      strokeDistance = 0;
      petTriggeredInStroke = false;
      lastPos = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!isPointerDown || !lastPos || !isUnlocked) return;
      const dx = e.clientX - lastPos.x;
      const dy = e.clientY - lastPos.y;
      strokeDistance += Math.hypot(dx, dy);
      lastPos = { x: e.clientX, y: e.clientY };

      const now = Date.now();
      if (strokeDistance > 16 && now - lastParticleTime > 160) {
        lastParticleTime = now;
        spawnPetParticle(e.clientX, e.clientY);
      }

      if (strokeDistance > 36 && !petTriggeredInStroke) {
        petTriggeredInStroke = true;
        if (currentMotion !== "pet") {
          playMotion("pet");
        } else {
          showBubble("そこそこ〜♪ もっと撫でて〜");
        }
        scheduleNextRandomMotion();
      }
    });

    function endPointerStroke(e) {
      if (!isPointerDown) return;
      // ほとんど動かずに離した場合は「軽くタップ」とみなしてワン！と反応
      if (!petTriggeredInStroke && strokeDistance <= 16 && isUnlocked) {
        spawnPetParticle(e.clientX, e.clientY);
        playMotion("bark", { customText: "ワン！（呼んだ？）" });
        scheduleNextRandomMotion();
      }
      isPointerDown = false;
      lastPos = null;
    }

    canvas.addEventListener("pointerup", endPointerStroke);
    canvas.addEventListener("pointercancel", endPointerStroke);

    // ブルーバック透過処理
    function renderChromaKey() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          if (b > 95 && b - Math.max(r, g) > 35) {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(renderChromaKey);
    }

    function startAppAfterUnlock() {
      initAudioContext();
      const slot = timeMode.value === "auto" ? getAutoSlot(new Date().getHours()) : timeMode.value;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;
      currentSlot = slot;
      roomImg.src = asset.room;
      playSlotBgm(asset.bgm);

      video.muted = false;
      video.volume = 0.9;
      playMotion("bark", { customText: "ワンワン！（おかえり〜！）" });
      scheduleNextRandomMotion();
    }

    // アクションボタン
    document.getElementById("petBtn").addEventListener("click", () => {
      const rect = canvas.getBoundingClientRect();
      spawnPetParticle(rect.left + rect.width * 0.5, rect.top + rect.height * 0.3);
      playMotion("pet");
      scheduleNextRandomMotion();
    });

    document.getElementById("treatBtn").addEventListener("click", () => {
      playMotion("sweet");
      scheduleNextRandomMotion();
    });

    document.getElementById("barkBtn").addEventListener("click", () => {
      playMotion("bark");
      scheduleNextRandomMotion();
    });

    document.getElementById("sleepBtn").addEventListener("click", () => {
      if (currentMotion === "sleep") {
        playMotion("sit", { customText: "ふわぁ…起きたよ！" });
      } else {
        playMotion("sleep", { customText: "すやすや…おやすみ〜…" });
      }
      scheduleNextRandomMotion();
    });

    bgmToggleBtn.addEventListener("click", () => {
      bgmEnabled = !bgmEnabled;
      initAudioContext();
      if (bgmGainNode) {
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
      }
      bgmToggleBtn.textContent = bgmEnabled ? "🎵 BGM: ON" : "🔇 BGM: OFF";
    });

    wakeBtn.addEventListener("click", async () => {
      try {
        if (!("wakeLock" in navigator)) {
          showBubble("このブラウザはスリープ防止に非対応だよ");
          return;
        }
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeBtn.textContent = "☀️ 常時ON中";
          showBubble("画面を起こしたまま一緒にいるね");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            wakeBtn.textContent = "☀️ 画面常時ON";
          });
        } else {
          await wakeLock.release();
        }
      } catch (err) {
        showBubble("スリープ防止をONにできなかったよ");
      }
    });

    // 別タブ・画面ロック時はBGMとAudioContextを一時停止し、戻ったら再開
    document.addEventListener("visibilitychange", () => {
      if (!audioCtx || !isUnlocked) return;
      if (document.hidden) {
        audioCtx.suspend().catch(() => {});
      } else {
        audioCtx.resume().catch(() => {});
      }
    });

    timeMode.addEventListener("change", syncRoomAndBgm);

    syncRoomAndBgm();
    setInterval(syncRoomAndBgm, 15000);
    video.muted = true;
    video.play().catch(() => {});
    renderChromaKey();
  </script>
</body>
</html>
