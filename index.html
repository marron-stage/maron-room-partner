<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>マロンのお部屋パートナー</title>
  <style>
    :root {
      --glass-bg: rgba(32, 24, 18, 0.56);
      --glass-border: rgba(255, 236, 208, 0.32);
      --text: #fffaf2;
      --accent: #f6b963;
      --bubble-bg: rgba(255, 250, 240, 0.96);
      --bubble-text: #4a3525;
      --bubble-border: #e6c39c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #14100d;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    /* 横画面推奨案内（縦画面時に表示） */
    .portrait-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 13, 0.96);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }

    @media (orientation: portrait) {
      .portrait-warning {
        display: flex;
      }
    }

    /* パスコードロック画面 (9648) */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #382a20 0%, #1a130e 100%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      transition: opacity 0.4s ease;
    }

    .lock-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lock-card {
      background: rgba(255, 248, 238, 0.08);
      border: 1.5px solid rgba(255, 224, 182, 0.25);
      border-radius: 28px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .lock-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffe8c8;
      letter-spacing: 0.05em;
    }

    .lock-dots {
      display: flex;
      gap: 14px;
      margin: 4px 0;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #f6b963;
      background: transparent;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .dot.filled {
      background: #f6b963;
      transform: scale(1.15);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 66px);
      gap: 10px;
    }

    .key-btn {
      height: 48px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      background: rgba(255, 247, 235, 0.14);
      border: 1.5px solid rgba(255, 224, 182, 0.28);
      color: #fff6e9;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .key-btn:active {
      background: rgba(246, 185, 99, 0.45);
      transform: translateY(2px) scale(0.96);
    }

    .lock-msg {
      height: 18px;
      font-size: 12.5px;
      color: #ffab91;
    }

    /* メインステージ（横画面16:9前提） */
    .full-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .room-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.8s ease;
      filter: contrast(0.98) brightness(0.97);
    }

    /* 立体接地影（カーペットの上に落ちる自然な影） */
    .marron-floor-shadow {
      position: absolute;
      left: 60%;
      bottom: calc(6.5% + env(safe-area-inset-bottom));
      width: 210px;
      height: 44px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(38, 22, 10, 0.46) 0%, rgba(38, 22, 10, 0.18) 52%, rgba(38, 22, 10, 0) 76%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      transition: width 0.25s ease, bottom 0.25s ease, opacity 0.2s ease;
    }

    /* マロン本体（9:16縦長動画用） */
    .marron-canvas {
      position: absolute;
      left: 60%;
      bottom: calc(1.5% + env(safe-area-inset-bottom));
      width: auto;
      height: 60vh;
      transform: translateX(-50%);
      transform-origin: center bottom;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      z-index: 4;
      filter: drop-shadow(0 10px 12px rgba(28, 16, 8, 0.42)) drop-shadow(0 2px 3px rgba(28, 16, 8, 0.25));
    }

    /* 16:9横長動画用（sitと同じ体格になる高さに統一） */
    .marron-canvas.is-wide {
      height: 49vh;
      bottom: calc(6% + env(safe-area-inset-bottom));
    }

    /* 8の字歩き（trot）は小ぶりに描かれているため大きく表示 */
    .marron-canvas.is-trot {
      height: 68vh;
      bottom: calc(3% + env(safe-area-inset-bottom));
    }

    /* 画面ペロペロ（lick）：ソファ側へ流れすぎないよう左寄りに補正 */
    .marron-canvas.is-licking {
      left: 44%;
      bottom: calc(6% + env(safe-area-inset-bottom));
      width: auto;
      height: 49vh;
      transform-origin: center center;
      z-index: 8;
      animation: lickApproach 10s ease-in-out forwards;
    }

    @keyframes lickApproach {
      0%, 24% {
        left: 44%;
        bottom: calc(6% + env(safe-area-inset-bottom));
        transform: translateX(-50%) scale(1);
      }
      45%, 74% {
        left: 38%;
        bottom: 6vh;
        transform: translateX(-50%) scale(2.35);
      }
      92%, 100% {
        left: 44%;
        bottom: calc(6% + env(safe-area-inset-bottom));
        transform: translateX(-50%) scale(1);
      }
    }

    /* ミッドナイト（ベッド）時はカーペット中央に配置 */
    .marron-canvas.is-sleeping {
      left: 62%;
      bottom: calc(1% + env(safe-area-inset-bottom));
      height: 52vh;
    }

    .marron-canvas:active {
      cursor: grabbing;
    }

    /* 上から降ってくるおやつアニメーション */
    .falling-treat {
      position: absolute;
      left: 60%;
      top: 12%;
      font-size: 36px;
      pointer-events: none;
      z-index: 14;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35));
      animation: dropTreatAnim 0.95s cubic-bezier(0.32, 0.94, 0.6, 1) forwards;
    }

    @keyframes dropTreatAnim {
      0% {
        opacity: 0;
        transform: translate(-50%, -60px) rotate(-25deg) scale(0.8);
      }
      20% {
        opacity: 1;
      }
      75% {
        opacity: 1;
        transform: translate(-50%, 38vh) rotate(15deg) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 44vh) rotate(25deg) scale(0.6);
      }
    }

    /* なでなで時のハート・肉球エフェクト */
    .pet-particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      z-index: 15;
      animation: floatUpParticle 0.95s ease-out forwards;
    }

    @keyframes floatUpParticle {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.7);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -32px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -62px) scale(0.95);
      }
    }

    /* おしゃれな上部HUD（時計・おやつ・BGM・画面常時ON） */
    .top-bar {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    /* おしゃれな時計カード */
    .clock-card {
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--glass-border);
      border-radius: 20px;
      padding: 8px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .clock-date {
      font-size: 11px;
      font-weight: 600;
      color: #f3d5ad;
      letter-spacing: 0.06em;
      opacity: 0.92;
    }

    .clock-time {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: #fffaf2;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* 右上の操作ピル群 */
    .top-controls {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button.pill-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease;
    }

    button.pill-btn:active {
      transform: scale(0.94);
    }

    button.pill-btn.active {
      background: rgba(246, 185, 99, 0.34);
      border-color: rgba(255, 214, 153, 0.78);
      color: #fff3dc;
    }

    button.pill-btn.treat-btn {
      background: rgba(246, 185, 99, 0.26);
      border-color: rgba(255, 214, 153, 0.65);
    }

    /* テスト用コントロール群（左下：時間帯 ＋ 各モーション確認ボタン） */
    .test-dock {
      position: absolute;
      left: 14px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      z-index: 12;
      max-width: calc(100vw - 28px);
    }

    .test-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--glass-border);
      border-radius: 18px;
      padding: 4px 7px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .test-btn {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 250, 242, 0.82);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
    }

    .test-btn:active {
      transform: scale(0.93);
    }

    .test-btn.active {
      background: rgba(246, 185, 99, 0.38);
      border-color: rgba(255, 214, 153, 0.75);
      color: #fffaf2;
    }

    /* しっぽ付きの可愛い吹き出しデザイン */
    .reaction-bubble {
      position: absolute;
      top: calc(30% + env(safe-area-inset-top));
      left: 60%;
      transform: translateX(-50%) scale(0.88);
      background: var(--bubble-bg);
      color: var(--bubble-text);
      border: 2.5px solid var(--bubble-border);
      border-radius: 22px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(45, 28, 14, 0.22);
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 12;
      pointer-events: none;
    }

    .reaction-bubble::before {
      content: "";
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 11px 9px 0;
      border-style: solid;
      border-color: var(--bubble-border) transparent transparent;
    }

    .reaction-bubble::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 7px 0;
      border-style: solid;
      border-color: var(--bubble-bg) transparent transparent;
    }

    .reaction-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    video#sourceVideo {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 縦画面時の案内 -->
  <div class="portrait-warning">
    <div style="font-size: 36px;">📱🔄</div>
    <div style="font-size: 17px; font-weight: 700;">iPadを横向きにしてね</div>
    <div style="font-size: 13px; color: #c8b9a6;">マロンのお部屋パートナーは横画面専用です</div>
  </div>

  <!-- パスコードロック画面 (9648) -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-title">🐾 マロンのお部屋へようこそ</div>
      <div class="lock-dots" id="lockDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="lock-msg" id="lockMsg"></div>
      <div class="keypad" id="keypad">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn" data-key="C" style="font-size:13px;">クリア</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn" data-key="BS" style="font-size:14px;">⌫</button>
      </div>
    </div>
  </div>

  <!-- メイン画面 -->
  <div class="full-stage" id="stage">
    <img id="roomImg" class="room-layer" src="assets/room_day.jpg" alt="マロンのお部屋" />
    <div class="marron-floor-shadow" id="floorShadow"></div>
    <canvas id="marronCanvas" class="marron-canvas"></canvas>

    <div class="top-bar">
      <div class="clock-card">
        <div class="clock-date" id="clockDate">--/-- (---)</div>
        <div class="clock-time" id="clockTime">--:--</div>
      </div>

      <div class="top-controls">
        <button class="pill-btn treat-btn" id="treatBtn">🦴 おやつ</button>
        <button class="pill-btn active" id="bgmToggleBtn">🎵 BGM: ON</button>
        <button class="pill-btn" id="wakeBtn">☀️ 画面常時ON</button>
      </div>
    </div>

    <!-- テスト用ドック（時間帯 ＋ 各モーション個別確認ボタン） -->
    <div class="test-dock" id="testDock">
      <div class="test-bar" id="testTimeBar">
        <button class="test-btn active" data-slot="auto">🕒 自動</button>
        <button class="test-btn" data-slot="morning">🌅 朝</button>
        <button class="test-btn" data-slot="day">☀️ 昼</button>
        <button class="test-btn" data-slot="sunset">🌇 夕方</button>
        <button class="test-btn" data-slot="night">🌙 夜</button>
        <button class="test-btn" data-slot="midnight">🌌 深夜</button>
      </div>
      <div class="test-bar" id="testMotionBar">
        <button class="test-btn" data-motion="sit">おすわり</button>
        <button class="test-btn" data-motion="down">伏せ</button>
        <button class="test-btn" data-motion="bark">吠える</button>
        <button class="test-btn" data-motion="sweet">甘え</button>
        <button class="test-btn" data-motion="treat">おやつ</button>
        <button class="test-btn" data-motion="spin">回転</button>
        <button class="test-btn" data-motion="trot">8の字</button>
        <button class="test-btn" data-motion="stretch">背伸び(あくび)</button>
        <button class="test-btn" data-motion="trick">芸(お腹)</button>
        <button class="test-btn" data-motion="lick">ペロペロ</button>
        <button class="test-btn" data-motion="pet">なで</button>
        <button class="test-btn" data-motion="sleep">睡眠</button>
      </div>
    </div>

    <div class="reaction-bubble" id="bubble">ワンワン！</div>
  </div>

  <video id="sourceVideo" src="assets/marron_sit.mp4" autoplay loop playsinline></video>

  <script>
    const PASSCODE = "9648";

    const ASSETS = {
      slots: {
        morning:  { room: "assets/room_morning.jpg",  bgm: "assets/bgm_morning.mp3",  label: "朝" },
        day:      { room: "assets/room_day.jpg",      bgm: "assets/bgm_day.mp3",      label: "昼" },
        sunset:   { room: "assets/room_sunset.jpg",   bgm: "assets/bgm_sunset.mp3",   label: "夕方" },
        night:    { room: "assets/room_night.jpg",    bgm: "assets/bgm_night.mp3",    label: "夜" },
        midnight: { room: "assets/room_midnight.jpg", bgm: "assets/bgm_midnight.mp3", label: "深夜" }
      },
      motions: {
        // 基本の待機・リラックスポーズ（ループ）
        sit:     { src: "assets/marron_sit.mp4",     loop: true,  lines: ["ここでまったりしてるよ〜", "じーっ…（こっちを見ている）"] },
        down:    { src: "assets/marron_down.mp4",    loop: true,  lines: ["ちょっと伏せてのんびりしようっと", "カーペット気持ちいいな〜"] },
        pet:     { src: "assets/marron_pet.mp4",     loop: true,  lines: ["なでなで気持ちいいな〜♪", "えへへ、もっと撫でて〜"] },
        sleep:   { src: "assets/marron_sleep.mp4",   loop: true,  lines: ["すやすや…おやすみ〜…", "Zzz…夢の中だワン…"] },

        // 気まぐれワンアクション（1回再生したら自動的に sit に戻る）
        bark:    { src: "assets/marron_bark.mp4",    loop: false, lines: ["ワンワン！", "ワン！（こっち見てるよ！）"] },
        sweet:   { src: "assets/marron_sweet.mp4",   loop: false, lines: ["クゥ〜ン…甘えさせて〜", "クゥン…そばにいてほしいワン…"] },
        treat:   { src: "assets/marron_treat.mp4",   loop: false, lines: ["待て…よしっ！もぐもぐ美味しい〜！", "わーいおやつだ！パクッ♪"] },
        spin:    { src: "assets/marron_spin.mp4",    loop: false, lines: ["あ！しっぽ発見！…うぅ、目が回る〜", "くるくる〜…ふらふらだワン…"] },
        trot:    { src: "assets/marron_trot.mp4",    loop: false, lines: ["お部屋の中をトコトコお散歩〜♪", "ルンルン♪ 8の字ウォーキング！"] },
        stretch: { src: "assets/marron_stretch.mp4", loop: false, lines: ["ふぁ〜あ…ぐーっと背伸び〜！", "う〜ん！伸びをしてリフレッシュ！"] },
        trick:   { src: "assets/marron_trick.mp4",   loop: false, lines: ["お手！おかわり！…えへへ、お腹なでて〜♪", "特技を披露しちゃうワン！"] },
        lick:    { src: "assets/marron_lick.mp4",    loop: false, lines: ["わーい！ペロペロ〜！（近い近い！）", "大好きだワン！ペロッ♪"] }
      }
    };

    const RANDOM_ONE_ACTIONS = [
      "bark",
      "sweet",
      "spin",
      "trot",
      "stretch",
      "trick",
      "lick",
      "down"
    ];

    // ロック画面処理
    let inputCode = "";
    let isUnlocked = false;
    const lockScreen = document.getElementById("lockScreen");
    const lockDots = document.querySelectorAll("#lockDots .dot");
    const lockMsg = document.getElementById("lockMsg");

    function updateDots() {
      lockDots.forEach((dot, idx) => {
        dot.classList.toggle("filled", idx < inputCode.length);
      });
    }

    document.getElementById("keypad").addEventListener("click", (e) => {
      const btn = e.target.closest(".key-btn");
      if (!btn || isUnlocked) return;
      const key = btn.dataset.key;

      if (key === "C") {
        inputCode = "";
        lockMsg.textContent = "";
      } else if (key === "BS") {
        inputCode = inputCode.slice(0, -1);
        lockMsg.textContent = "";
      } else if (inputCode.length < 4) {
        inputCode += key;
      }
      updateDots();

      if (inputCode.length === 4) {
        if (inputCode === PASSCODE) {
          isUnlocked = true;
          lockScreen.classList.add("hidden");
          startAppAfterUnlock();
        } else {
          lockMsg.textContent = "パスコードが違うみたい…";
          setTimeout(() => {
            inputCode = "";
            updateDots();
          }, 450);
        }
      }
    });

    // メインアプリ要素
    const stage = document.getElementById("stage");
    const roomImg = document.getElementById("roomImg");
    const floorShadow = document.getElementById("floorShadow");
    const clockDate = document.getElementById("clockDate");
    const clockTime = document.getElementById("clockTime");
    const bubble = document.getElementById("bubble");
    const treatBtn = document.getElementById("treatBtn");
    const bgmToggleBtn = document.getElementById("bgmToggleBtn");
    const wakeBtn = document.getElementById("wakeBtn");
    const testTimeBar = document.getElementById("testTimeBar");
    const testMotionBar = document.getElementById("testMotionBar");

    const video = document.getElementById("sourceVideo");
    const canvas = document.getElementById("marronCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let forcedSlot = "auto";
    let currentSlot = "";
    let currentMotion = "sit";
    let lastOneAction = "";
    let bgmEnabled = true;
    let wakeLock = null;
    let bubbleTimer = null;
    let randomMotionTimer = null;

    // Web Audio API
    let audioCtx = null;
    let bgmGainNode = null;
    let bgmSourceNode = null;
    const bgmBufferCache = {};
    let bgmLoadToken = 0;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
        bgmGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function playPetHapticPulse() {
      if (!audioCtx || audioCtx.state !== "running") return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(75, now);
        osc.frequency.exponentialRampToValueAtTime(44, now + 0.06);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.38, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function stopBgmNode() {
      if (bgmSourceNode) {
        try {
          bgmSourceNode.stop();
          bgmSourceNode.disconnect();
        } catch (e) {}
        bgmSourceNode = null;
      }
    }

    async function playSlotBgm(bgmUrl) {
      if (!isUnlocked) return;
      initAudioContext();
      const token = ++bgmLoadToken;
      stopBgmNode();

      try {
        let buffer = bgmBufferCache[bgmUrl];
        if (!buffer) {
          const response = await fetch(bgmUrl);
          const arrayBuffer = await response.arrayBuffer();
          buffer = await audioCtx.decodeAudioData(arrayBuffer);
          bgmBufferCache[bgmUrl] = buffer;
        }
        if (token !== bgmLoadToken) return;

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(bgmGainNode);
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
        source.start(0);
        bgmSourceNode = source;
      } catch (err) {
        console.warn("BGM再生エラー:", err);
      }
    }

    function showBubble(text, duration = 3200) {
      if (!text) return;
      bubble.textContent = text;
      bubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), duration);
    }

    function spawnPetParticle(x, y) {
      const icons = ["💖", "🐾", "✨", "♪"];
      const el = document.createElement("div");
      el.className = "pet-particle";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function dropTreatAndEat() {
      if (!isUnlocked) return;
      initAudioContext();

      if (currentSlot === "midnight") {
        showBubble("Zzz…むにゃむにゃ…（おやつの夢を見てるよ）");
        return;
      }

      clearTimeout(randomMotionTimer);

      const treatEl = document.createElement("div");
      treatEl.className = "falling-treat";
      treatEl.textContent = "🦴";
      stage.appendChild(treatEl);
      setTimeout(() => treatEl.remove(), 960);

      setTimeout(() => {
        playMotion("treat", { customText: "わーい！おやつだ！待て…よしっ！パクッ♪" });
      }, 320);
    }

    treatBtn.addEventListener("click", dropTreatAndEat);

    function getAutoSlot(hour) {
      if (hour >= 5 && hour < 10) return "morning";
      if (hour >= 10 && hour < 16) return "day";
      if (hour >= 16 && hour < 19) return "sunset";
      if (hour >= 19 && hour < 23) return "night";
      return "midnight";
    }

    const WEEKDAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

    function syncClockRoomAndBgm(isManualTest = false) {
      const now = new Date();
      const mon = now.getMonth() + 1;
      const day = now.getDate();
      const wday = WEEKDAYS[now.getDay()];
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");

      clockDate.textContent = `${mon}/${day} (${wday})`;
      clockTime.textContent = `${hh}:${mm}`;

      const slot = forcedSlot === "auto" ? getAutoSlot(now.getHours()) : forcedSlot;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;

      if (roomImg.getAttribute("src") !== asset.room) {
        roomImg.src = asset.room;
      }

      if (currentSlot !== slot) {
        const prevSlot = currentSlot;
        currentSlot = slot;

        if (isUnlocked) {
          playSlotBgm(asset.bgm);

          if (slot === "midnight") {
            clearTimeout(randomMotionTimer);
            playMotion("sleep", { customText: "すやすや…おやすみなさい…", silentBubble: prevSlot === "" });
          } else if (prevSlot === "midnight") {
            playMotion("bark", { customText: "ワン！おはよう〜！" });
          } else if (isManualTest) {
            showBubble(`【テスト】${asset.label}の時間帯に切り替えたよ！`);
          }
        }
      }
    }

    // テスト用時間帯切り替えボタン
    testTimeBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".test-btn");
      if (!btn) return;
      forcedSlot = btn.dataset.slot;
      testTimeBar.querySelectorAll(".test-btn").forEach((b) => {
        b.classList.toggle("active", b === btn);
      });
      syncClockRoomAndBgm(true);
    });

    // テスト用モーション切り替えボタン
    testMotionBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".test-btn");
      if (!btn || !isUnlocked) return;
      initAudioContext();
      clearTimeout(randomMotionTimer);
      const motionKey = btn.dataset.motion;
      if (motionKey === "treat") {
        dropTreatAndEat();
      } else {
        playMotion(motionKey);
      }
    });

    function updateMotionTestHighlight(motionKey) {
      testMotionBar.querySelectorAll(".test-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.motion === motionKey);
      });
    }

    // モーション切り替え
    function playMotion(motionKey, { customText = null, silentBubble = false, loopOverride = null } = {}) {
      const motion = ASSETS.motions[motionKey];
      if (!motion) return;

      currentMotion = motionKey;
      updateMotionTestHighlight(motionKey);

      if (motionKey !== "sit" && motionKey !== "sleep" && motionKey !== "pet") {
        lastOneAction = motionKey;
      }

      const isLicking = motionKey === "lick";
      const isTrot = motionKey === "trot";
      canvas.classList.toggle("is-sleeping", motionKey === "sleep");
      canvas.classList.toggle("is-licking", isLicking);
      if (isLicking) {
        canvas.style.animation = "none";
        void canvas.offsetWidth;
        canvas.style.animation = "";
      }
      canvas.classList.toggle("is-trot", isTrot);
      floorShadow.style.opacity = isLicking ? "0" : "1";

      video.loop = loopOverride !== null ? loopOverride : motion.loop;
      video.src = motion.src;
      video.load();
      video.play().catch(() => {});

      if (!silentBubble) {
        const text = customText !== null
          ? customText
          : motion.lines[Math.floor(Math.random() * motion.lines.length)];
        showBubble(text);
      }

      if (motionKey === "sit" && currentSlot !== "midnight") {
        scheduleNextOneAction(15000, 25000);
      } else if (motionKey === "down" && currentSlot !== "midnight") {
        clearTimeout(randomMotionTimer);
        const restDelay = 12000 + Math.floor(Math.random() * 6000);
        randomMotionTimer = setTimeout(() => {
          if (isUnlocked && !isPointerDown && currentMotion === "down" && currentSlot !== "midnight") {
            playMotion("sit", { silentBubble: true });
          }
        }, restDelay);
      }
    }

    // 単発ワンアクション動画が終わったら、必ず基本の sit（深夜なら sleep）に戻る
    video.addEventListener("ended", () => {
      if (!video.loop) {
        if (currentSlot === "midnight") {
          playMotion("sleep", { silentBubble: true });
        } else {
          playMotion("sit", { silentBubble: true });
        }
      }
    });

    function scheduleNextOneAction(minMs = 15000, maxMs = 25000) {
      clearTimeout(randomMotionTimer);
      if (!isUnlocked || currentSlot === "midnight") return;

      const nextDelay = minMs + Math.floor(Math.random() * (maxMs - minMs));
      randomMotionTimer = setTimeout(() => {
        if (!isUnlocked || isPointerDown || currentSlot === "midnight") return;
        if (currentMotion !== "sit") return;

        const candidates = RANDOM_ONE_ACTIONS.filter((k) => k !== lastOneAction);
        const nextKey = candidates[Math.floor(Math.random() * candidates.length)];
        playMotion(nextKey);
      }, nextDelay);
    }

    // 直接指でなでなで
    let isPointerDown = false;
    let strokeDistance = 0;
    let lastPos = null;
    let lastParticleTime = 0;
    let lastHapticTime = 0;
    let petTriggeredInStroke = false;

    canvas.addEventListener("pointerdown", (e) => {
      if (!isUnlocked) return;
      initAudioContext();
      isPointerDown = true;
      strokeDistance = 0;
      petTriggeredInStroke = false;
      lastPos = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!isPointerDown || !lastPos || !isUnlocked) return;
      const dx = e.clientX - lastPos.x;
      const dy = e.clientY - lastPos.y;
      const step = Math.hypot(dx, dy);
      strokeDistance += step;
      lastPos = { x: e.clientX, y: e.clientY };

      const now = Date.now();

      if (step > 1.2 && now - lastHapticTime > 70) {
        lastHapticTime = now;
        playPetHapticPulse();
      }

      if (strokeDistance > 12 && now - lastParticleTime > 150) {
        lastParticleTime = now;
        spawnPetParticle(e.clientX, e.clientY);
      }

      if (strokeDistance > 24 && !petTriggeredInStroke) {
        petTriggeredInStroke = true;
        clearTimeout(randomMotionTimer);
        if (currentSlot === "midnight") {
          showBubble("んぅ…なでなで…すやすや…");
        } else {
          playMotion("pet", { loopOverride: true });
        }
      }
    });

    function endPointerStroke(e) {
      if (!isPointerDown) return;

      if (petTriggeredInStroke) {
        if (currentSlot === "midnight") {
          playMotion("sleep", { silentBubble: true });
        } else {
          playMotion("sit", { silentBubble: true });
        }
      } else if (strokeDistance <= 14 && isUnlocked) {
        spawnPetParticle(e.clientX, e.clientY);
        if (currentSlot === "midnight") {
          showBubble("Zzz…むにゃむにゃ…");
        } else {
          clearTimeout(randomMotionTimer);
          const tapActions = ["bark", "trick", "lick", "spin", "stretch"];
          const candidates = tapActions.filter((k) => k !== lastOneAction);
          const nextKey = candidates[Math.floor(Math.random() * candidates.length)];
          playMotion(nextKey);
        }
      }

      isPointerDown = false;
      petTriggeredInStroke = false;
      lastPos = null;
    }

    canvas.addEventListener("pointerup", endPointerStroke);
    canvas.addEventListener("pointercancel", endPointerStroke);

    // ブルーバック透過処理
    function renderChromaKey() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          const isWideVideo = video.videoWidth > video.videoHeight;
          canvas.classList.toggle("is-wide", isWideVideo);
          floorShadow.style.width = isWideVideo ? "230px" : "200px";
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          if (b > 95 && b - Math.max(r, g) > 35) {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(renderChromaKey);
    }

    function startAppAfterUnlock() {
      initAudioContext();
      const slot = forcedSlot === "auto" ? getAutoSlot(new Date().getHours()) : forcedSlot;
      const asset = ASSETS.slots[slot] || ASSETS.slots.day;
      currentSlot = slot;
      roomImg.src = asset.room;
      playSlotBgm(asset.bgm);

      video.muted = false;
      video.volume = 0.9;

      if (slot === "midnight") {
        playMotion("sleep", { customText: "すやすや…もう夜遅いよ…Zzz" });
      } else {
        playMotion("bark", { customText: "ワンワン！（おかえり〜！）" });
      }
    }

    bgmToggleBtn.addEventListener("click", () => {
      bgmEnabled = !bgmEnabled;
      initAudioContext();
      if (bgmGainNode) {
        bgmGainNode.gain.value = bgmEnabled ? 0.45 : 0;
      }
      bgmToggleBtn.textContent = bgmEnabled ? "🎵 BGM: ON" : "🔇 BGM: OFF";
      bgmToggleBtn.classList.toggle("active", bgmEnabled);
    });

    wakeBtn.addEventListener("click", async () => {
      try {
        if (!("wakeLock" in navigator)) {
          showBubble("このブラウザはスリープ防止に非対応だよ");
          return;
        }
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeBtn.textContent = "☀️ 常時ON中";
          wakeBtn.classList.add("active");
          showBubble("画面を起こしたまま一緒にいるね");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            wakeBtn.textContent = "☀️ 画面常時ON";
            wakeBtn.classList.remove("active");
          });
        } else {
          await wakeLock.release();
        }
      } catch (err) {
        showBubble("スリープ防止をONにできなかったよ");
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!audioCtx || !isUnlocked) return;
      if (document.hidden) {
        audioCtx.suspend().catch(() => {});
      } else {
        audioCtx.resume().catch(() => {});
      }
    });

    syncClockRoomAndBgm();
    setInterval(() => syncClockRoomAndBgm(false), 10000);
    video.muted = true;
    video.play().catch(() => {});
    renderChromaKey();
  </script>
</body>
</html>
